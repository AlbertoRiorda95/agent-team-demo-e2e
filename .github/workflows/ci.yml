# .github/workflows/ci.yml: the project's CI. It checks every PR, whoever
# wrote it (you or an agent): build, test, static analysis, SBOM and licenses,
# vulnerabilities.
# Polyglot monorepo: the "changes" job says which services changed (all of them
# on main), and each service job runs only when its service changed and already
# exists (its manifest is in the repository). The security scans always run on
# the whole repository.
# Actions are pinned to a commit SHA; the comment says which release it is.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read     # the team's packages on GitHub Packages (ci/registry.sh)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proto: ${{ steps.f.outputs.proto }}
      api: ${{ steps.f.outputs.api }}
      propagator: ${{ steps.f.outputs.propagator }}
      ros2: ${{ steps.f.outputs.ros2 }}
      store: ${{ steps.f.outputs.store }}
      web: ${{ steps.f.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE" ]; then
            changed=$(git diff --name-only "$(git merge-base "$BASE" HEAD)" HEAD)
          else
            changed=ALL    # push to main, manual run: everything that exists
          fi
          # <output> <manifest that must exist> <path regex of the files that trigger it>
          out() {
            local on=false
            if [ -e "$2" ]; then
              if [ "$changed" = ALL ] || echo "$changed" | grep -qE "$3"; then on=true; fi
            fi
            echo "$1=$on" >> "$GITHUB_OUTPUT"; echo "$1=$on"
          }
          common='^(\.github/workflows/ci\.yml|ci/)'
          out proto      buf.yaml                                "$common|^proto/|^buf\.(yaml|gen\.yaml|lock)$"
          out api        services/api/pyproject.toml             "$common|^proto/|^services/api/"
          out propagator services/propagator/CMakeLists.txt      "$common|^proto/|^services/propagator/"
          out ros2       services/ros2-publisher/package.xml     "$common|^proto/|^services/ros2-publisher/"
          out store      services/store/gradlew                  "$common|^proto/|^services/store/"
          out web        package-lock.json                       "$common|^proto/|^(package(-lock)?\.json|services/(viz|control)-web/|libs/|packages/|docs/api/)"

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0    # buf breaking compares with the base branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: ./ci/registry.sh login
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npx buf lint
      - name: Breaking changes against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # no .proto on the base branch yet (the first proto PR): nothing to compare with
          if git ls-tree -r --name-only "origin/${BASE_REF}" | grep -q '\.proto$'; then
            npx buf breaking --against ".git#branch=origin/${BASE_REF}"
          else
            echo "No .proto files on ${BASE_REF}: skipping buf breaking"
          fi

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest

  propagator:
    needs: changes
    if: needs.changes.outputs.propagator == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/propagator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: pipx install conan==2.34.0
      - run: conan profile detect --force
      - run: conan install . --build=missing -s compiler.cppstd=20
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ctest --preset release --output-on-failure

  ros2-publisher:
    needs: changes
    if: needs.changes.outputs.ros2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ros:jazzy    # pin by digest (docs/roles/devops.md)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build and test
        shell: bash
        working-directory: services/ros2-publisher
        run: |
          source /opt/ros/jazzy/setup.bash
          apt-get update && rosdep update && rosdep install --from-paths . --ignore-src -y
          colcon build
          colcon test
          colcon test-result --verbose

  store:
    needs: changes
    if: needs.changes.outputs.store == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: ./gradlew build    # compile, unit and Testcontainers tests (Docker is on the runner)

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
      # the team's registry (ci/registry.env): read token from the secret, else the job token
      - run: ./ci/registry.sh login
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build    # every workspace's build (ci/npm-workspaces.sh)
      - run: npm test         # every workspace's tests (ci/npm-workspaces.sh)

  # Static analysis for bugs and unsafe code. On a PR only the findings it
  # introduces fail the check; on main the full report is kept as an artifact.
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0    # the history up to the PR base, for the baseline
      - run: ./ci/install-scanners.sh semgrep
      - run: ./ci/scan.sh static
        env:
          BASELINE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: static-analysis
          path: reports/semgrep.*
          retention-days: 30

  # SBOM of the whole repository. syft reads the lockfiles of every stack
  # (package-lock.json, uv.lock, gradle.lockfile, conan.lock); the npm packages
  # are installed too, without their scripts, for their license data.
  sbom-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      # the team's registry (ci/registry.env): read token from the secret, else the job token
      - run: ./ci/registry.sh login
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: if [ -f package-lock.json ]; then npm ci --ignore-scripts; fi
      - run: ./ci/install-scanners.sh
      - run: ./ci/scan.sh sbom-licenses
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: sbom-and-licenses
          path: reports/
          retention-days: 90

  # UI tests of both web apps: run only when playwright.config.ts exists (the
  # foundations task renames the .example). Report and screenshots per viewport
  # are kept as the "ui-report" artifact.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: enabled
        run: |
          if [ -f playwright.config.ts ]; then echo "on=true" >> "$GITHUB_OUTPUT";
          else echo "No playwright.config.ts: UI tests not set up yet."; fi
      - if: steps.enabled.outputs.on == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
      - if: steps.enabled.outputs.on == 'true'
        run: ./ci/registry.sh login
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.enabled.outputs.on == 'true'
        run: npm ci
      - if: steps.enabled.outputs.on == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.enabled.outputs.on == 'true'
        run: npx playwright test
      - if: always() && steps.enabled.outputs.on == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ui-report
          path: reports/ui/
          retention-days: 30

  vulnerabilities:
    needs: sbom-licenses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom-and-licenses
          path: reports/
      - run: ./ci/install-scanners.sh
      - run: ./ci/scan.sh vulnerabilities
      # the image of every service that has a Dockerfile, built from the
      # repository root (built here, never pushed): ci/build-images.sh
      - name: Build and scan the service images
        run: ./ci/build-images.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: vulnerabilities
          path: |
            reports/grype.*
            reports/trivy-*.json
          retention-days: 90
      # Optional: show the findings in the Security tab (code scanning; on private
      # repositories it needs GitHub Code Security). Add "security-events: write"
      # to the job permissions and uncomment.
      # - uses: github/codeql-action/upload-sarif@<sha>
      #   if: always()
      #   with:
      #     sarif_file: reports/grype.sarif

  # Reference documentation built from the code (OpenAPI, pdoc, javadoc,
  # typedoc) by ci/reference.sh. Kept as an artifact, not committed: the
  # writer's documents link to it.
  reference-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        if: hashFiles('services/api/pyproject.toml') != ''
        with:
          python-version: "3.12"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        if: hashFiles('services/store/gradlew') != ''
        with:
          distribution: temurin
          java-version: "25"
      # the team's registry (ci/registry.env): read token from the secret, else the job token
      - run: ./ci/registry.sh login
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: if [ -f package-lock.json ]; then npm ci --ignore-scripts; fi
      - run: ./ci/reference.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: reference-docs
          path: reports/reference/
          if-no-files-found: ignore
          retention-days: 30

  # The one check to require on `main` (branch protection): it sums up the jobs it
  # needs. A job skipped on purpose (its service did not change) passes; a failed
  # or cancelled one fails it.
  ci-ok:
    if: always()
    needs: [changes, proto, api, propagator, ros2-publisher, store, web, static-analysis, sbom-licenses, ui, vulnerabilities]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
