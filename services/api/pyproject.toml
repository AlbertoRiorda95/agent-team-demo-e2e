[project]
name = "trajectory-api"
version = "0.0.0"
description = "Ingestion REST API of the trajectory demo (docs/api/openapi.yaml)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "nats-py==2.17.0",
    "protobuf==6.33.6",
    "pydantic==2.14.4",
    "uvicorn==0.54.0",
]

[project.scripts]
trajectory-api = "trajectory_api.main:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "openapi-core==0.23.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
    "testcontainers[nats]==4.15.0",
    "types-protobuf==6.32.1.20260221",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# trajectory: the generated code of proto/trajectory/ (scripts/generate-proto.sh)
module-name = ["trajectory_api", "trajectory"]

[tool.ruff]
line-length = 100
target-version = "py312"
# generated by buf (scripts/generate-proto.sh), never edited by hand
extend-exclude = ["src/trajectory"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["trajectory_api", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# generated by buf: checked by its own stubs, not linted
module = ["trajectory.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: against a real NATS in Docker (testcontainers); deselect with -m 'not integration'",
]
