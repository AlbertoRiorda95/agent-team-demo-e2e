# The TypeScript-only template of this package: `npm run generate` writes the
# protobuf-es code of proto/ into src/gen/. src/gen/ is committed (the reference
# docs read src/ without building) and `npm test` fails if it is not in step
# with proto/: run `npm run generate` and commit. Keep the plugin
# options in step with the TypeScript entry of the root buf.gen.yaml.
version: v2
clean: true
plugins:
  - local: protoc-gen-es
    out: src/gen
    opt:
      - target=ts
      - import_extension=js
