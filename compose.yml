# compose.yml: local development stack (docker compose up).
# NATS with JetStream, PostgreSQL 17 and every service of AGENTS.md > Services,
# each built from its services/<name>/Dockerfile with the repository root as
# the context: `docker compose up --build` (images built here, never pushed).
# Settings come from .env (copy .env.example): no secret is written here.
#
# Ports are bound to 127.0.0.1: reachable from this machine only.
# Rollback: `docker compose down` (add `-v` to also drop the database and the
# propagator and store config volumes).
name: agent-team-demo-e2e

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  nats:
    <<: *hardening
    image: nats:2-alpine@sha256:558394a23dd3c36f2d3a64b51865fd09908010e80a542cea5e75c2af543ed62a  # nats-server 2.15.3
    user: "65534:65534"          # nobody: NATS needs no privilege
    read_only: true
    # settings in deploy/nats/nats.conf (max_payload has no CLI flag)
    command: ["--config", "/etc/nats/nats.conf"]
    configs:
      - source: nats-conf
        target: /etc/nats/nats.conf
        mode: 0444
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      # JetStream storage: in memory, reset on restart (dev only; the store
      # service keeps the durable data in PostgreSQL)
      - type: tmpfs
        target: /data
        tmpfs:
          size: 268435456        # 256 MiB
          # explicit, so uid 65534 can write after a `docker compose stop/start`
          # too (the default mode is not kept on restart: JetStream then fails
          # with "mkdir /data/jetstream: permission denied")
          mode: 01777
    healthcheck:
      # fails unless the server is up and JetStream is enabled
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Creates the JetStream streams of proto/nats/streams/ (proto/README.md >
  # Streams), then exits 0; the services start only after it succeeded.
  # A stream that already exists is left as it is, so it can run again
  # (`docker compose up` after a `stop`). Re-run by hand: `docker compose up nats-init`.
  nats-init:
    <<: *hardening
    image: natsio/nats-box:0.20.2-nonroot@sha256:d00bffed51ea1a29e58852698bde37020d306af55585882f88dbcf09dd86f5fe  # nats CLI 0.5.1, uid 1000
    restart: "no"                # one-shot job
    read_only: true
    environment:
      NATS_URL: nats://nats:4222
    volumes:
      - type: bind
        source: ./proto/nats/streams
        target: /streams
        read_only: true
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        for f in /streams/*.json; do
          name=$$(basename "$$f" .json)
          if nats stream info "$$name" >/dev/null 2>&1; then
            echo "stream $$name exists, left unchanged"
          else
            nats stream add --config "$$f" >/dev/null
            echo "stream $$name created"
          fi
        done
        nats stream ls
    depends_on:
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  postgres:
    <<: *hardening
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73  # PostgreSQL 17.12
    user: postgres               # the image's own unprivileged user (uid 70)
    read_only: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env (see .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # writable paths a read-only container still needs (socket, temp files)
      - type: tmpfs
        target: /var/run/postgresql
      - type: tmpfs
        target: /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # Creates the read-only login `viz_web` of the viz-web server
  # (docs/design/viewer.md > Read-only database user), then exits 0: a member
  # of the NOLOGIN role `trajectory_reader`, whose SELECT grants come from
  # store's migration V3. Idempotent: the role and the user are created only
  # when missing (either order with store works), the password is set from
  # VIZ_WEB_DB_PASSWORD on every run. Re-run by hand: `docker compose up db-init`.
  # The password reaches psql as a variable (quoted with %L), never in argv.
  db-init:
    <<: *hardening
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73  # PostgreSQL 17.12 (psql)
    restart: "no"                # one-shot job
    user: postgres
    read_only: true
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env (see .env.example)}
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      VIZ_WEB_DB_PASSWORD: ${VIZ_WEB_DB_PASSWORD:?set VIZ_WEB_DB_PASSWORD in .env (see .env.example)}
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        psql -X -q -v ON_ERROR_STOP=1 -v "pw=$$VIZ_WEB_DB_PASSWORD" <<'SQL'
        DO $$$$
        BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'trajectory_reader') THEN
            CREATE ROLE trajectory_reader NOLOGIN;
          END IF;
        EXCEPTION
          WHEN duplicate_object THEN NULL;  -- store's V3 created it at the same time
        END
        $$$$;
        DO $$$$
        BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'viz_web') THEN
            CREATE ROLE viz_web LOGIN;
          END IF;
        END
        $$$$;
        SELECT format('ALTER ROLE viz_web WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT PASSWORD %L', :'pw') \gexec
        GRANT trajectory_reader TO viz_web WITH INHERIT TRUE;
        SQL
        echo "role viz_web ready (member of trajectory_reader)"
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # --- the services ---
  api:
    <<: *hardening
    build:
      context: .
      dockerfile: services/api/Dockerfile
    read_only: true
    environment:
      NATS_URL: nats://nats:4222
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    tmpfs:
      - /tmp
    depends_on:
      nats-init:                 # the JetStream streams exist
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  propagator:
    <<: *hardening
    build:
      context: .
      dockerfile: services/propagator/Dockerfile
    read_only: true
    environment:
      NATS_URL: nats://nats:4222
      # the config in force (docs/design/propagation.md > Data and API),
      # kept across restarts in the propagator-config volume
      PROPAGATOR_CONFIG_PATH: /var/lib/propagator/config.json
    volumes:
      # writable on the read-only root filesystem; the image creates the
      # folder owned by uid 10001, so a new volume starts writable for it
      - propagator-config:/var/lib/propagator
    depends_on:
      nats-init:                 # the JetStream streams exist
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  ros2-publisher:
    <<: *hardening
    build:
      context: .
      dockerfile: services/ros2-publisher/Dockerfile
    read_only: true
    # ROS_DOMAIN_ID and ROS_STATIC_PEERS unset: the node logs "no ROS2 network configured"
    tmpfs:
      - /tmp                     # ROS_HOME=/tmp/ros (ROS logs)
    depends_on:
      nats-init:                 # the JetStream streams exist
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  store:
    <<: *hardening
    build:
      context: .
      dockerfile: services/store/Dockerfile
    read_only: true
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env (see .env.example)}
      DATABASE_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      # the config in force (docs/design/persistence.md > Data and API), kept
      # across restarts in the store-config volume; the credentials in it stay
      # sealed with STORE_CONFIG_KEY
      STORE_CONFIG_PATH: /var/lib/store/config.json
      # base64 of 32 random bytes (see .env.example); empty: store runs
      # `degraded` and rejects config sets that carry credentials
      STORE_CONFIG_KEY: ${STORE_CONFIG_KEY:-}
    volumes:
      # writable on the read-only root filesystem; the image creates the
      # folder owned by uid 10001, so a new volume starts writable for it
      - store-config:/var/lib/store
    tmpfs:
      - /tmp                     # JVM perf data and temporary files
    depends_on:
      nats-init:                 # the JetStream streams exist
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  viz-web:
    <<: *hardening
    build:
      context: .
      dockerfile: services/viz-web/Dockerfile
    read_only: true
    environment:
      VIZ_WEB_SERVER_HOST: 0.0.0.0
      VIZ_WEB_SERVER_PORT: "3001"
      NATS_URL: nats://nats:4222
      # the read-only login created by db-init (the same names as store, its own values)
      DATABASE_URL: postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env (see .env.example)}
      DATABASE_USER: viz_web
      DATABASE_PASSWORD: ${VIZ_WEB_DB_PASSWORD:?set VIZ_WEB_DB_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:${VIZ_WEB_SERVER_PORT:-3001}:3001"
    depends_on:
      nats-init:                 # the JetStream streams exist
        condition: service_completed_successfully
      db-init:                   # the viz_web login exists
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  control-web:
    <<: *hardening
    build:
      context: .
      dockerfile: services/control-web/Dockerfile
    read_only: true
    environment:
      CONTROL_WEB_PORT: "5174"
    ports:
      # host port 3002 by default: 5174 is the Vite dev server of the control-web UI
      - "127.0.0.1:${CONTROL_WEB_SERVER_PORT:-3002}:5174"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

configs:
  # nats-server settings: max_payload 8 MiB, JetStream in /data, monitoring 8222
  nats-conf:
    file: ./deploy/nats/nats.conf

volumes:
  postgres-data:
  propagator-config:            # propagator's local config file
  store-config:                 # store's local config file (sealed credentials)
