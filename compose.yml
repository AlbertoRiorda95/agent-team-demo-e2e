# compose.yml: local development stack (docker compose up).
# Infrastructure only for now: NATS with JetStream and PostgreSQL 17. The
# services join in the foundations task 11 (a Dockerfile per service).
# Settings come from .env (copy .env.example): no secret is written here.
#
# Ports are bound to 127.0.0.1: reachable from this machine only.
# Rollback: `docker compose down` (add `-v` to also drop the database volume).
name: agent-team-demo-e2e

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  nats:
    <<: *hardening
    # TODO(pin): replace the tag with its digest, nats:2-alpine@sha256:<digest>
    image: nats:2-alpine
    user: "65534:65534"          # nobody: NATS needs no privilege
    read_only: true
    # JetStream on, stored in /data; monitoring port 8222 (/healthz)
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      # JetStream storage: in memory, reset on restart (dev only; the store
      # service keeps the durable data in PostgreSQL)
      - type: tmpfs
        target: /data
        tmpfs:
          size: 268435456        # 256 MiB; Docker's default mode 1777 lets uid 65534 write
    healthcheck:
      # fails unless the server is up and JetStream is enabled
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  postgres:
    <<: *hardening
    # TODO(pin): replace the tag with its digest, postgres:17-alpine@sha256:<digest>
    image: postgres:17-alpine
    user: postgres               # the image's own unprivileged user (uid 70)
    read_only: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env (see .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # writable paths a read-only container still needs (socket, temp files)
      - type: tmpfs
        target: /var/run/postgresql
      - type: tmpfs
        target: /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  postgres-data:
