# nats-server settings, mounted by compose.yml (service nats).
# Reference: https://docs.nats.io/running-a-nats-service/configuration
port: 4222
http_port: 8222                  # monitoring: /healthz, /varz

# 8 MiB: the largest TrajectoryComputed (100000 samples) is about 7 MB
# (proto/README.md > Encoding); the default 1 MiB rejects it.
max_payload: 8388608

jetstream {
  store_dir: /data
}
